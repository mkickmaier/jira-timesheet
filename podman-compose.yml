services:
  # JIRA PI Planning Application
  jira-pi-planning:
    build: .
    container_name: jira-pi-planning
    environment:
    volumes:
      - ./uploads:/usr/src/app/uploads
      - ./data:/usr/src/app/data
      # Uncomment if you want to use a local .env file instead of environment variables above
      - .env:/usr/src/app/.env
    networks:
      - app-network
    # Port not exposed externally - only accessible via proxy

  # Nginx reverse proxy with TLS and HTTP Basic Auth
  proxy:
    image: docker.io/library/nginx:alpine
    container_name: nginx-proxy
    ports:
      - "443:443"   # HTTPS
      - "80:80"     # HTTP will be redirected to HTTPS by NGINX
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - app-network
    depends_on:
      - jira-pi-planning
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
