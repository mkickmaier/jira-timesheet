<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PI Capacity Planning</title>
  <link rel="stylesheet" href="capacity.css">
</head>
<body>
  <header>
    <h2>PI Capacity Planning</h2>
    <div>
      <a href="index.html">Planning</a>
      <a href="capacity.html">Capacity</a>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="row">
        <label for="piName">PI Name (e.g. 26_04):</label>
        <input type="text" id="piName" placeholder="PI Name">
        <button id="loadBtn">Load Capacity</button>
      </div>
    </div>

    <div id="status"></div>

    <div class="card" id="resultsCard" style="display:none">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
        <div>
          <h3 id="piTitle" style="margin: 0;"></h3>
          <div id="lastRefreshed" class="last-refreshed"></div>
        </div>
      </div>
      <div style="overflow-x: auto; max-height: 70vh; overflow-y: auto;">
        <table id="capacityTable">
          <thead>
            <tr id="tableHeader">
              <th>Team Member</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Details Modal -->
  <div id="detailsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="close" id="closeModal">&times;</span>
        <h3 id="modalTitle"></h3>
      </div>
      <div class="modal-section">
        <h4>Daily Planning</h4>
        <div id="dailyCapacity"></div>
      </div>
      <div class="modal-section">
        <h4>Planned Tickets</h4>
        <div id="ticketsList"></div>
      </div>
    </div>
  </div>

  <script src="capacity.js"></script>
</body>
</html>
