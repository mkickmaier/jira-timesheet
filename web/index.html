<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Member Planning</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header>
    <h2>Team Member Planning</h2>
    <div>
      <a href="index.html">Planning</a>
      <a href="capacity.html">Capacity</a>
    </div>
  </header>
  <main>
    <div id="contextMenu"></div>
    <div class="card" id="configCard">
      <div class="card-header" onclick="toggleCard()">
        <h3>Configuration</h3>
        <span id="toggleIcon" class="toggle-icon collapsed">▼</span>
      </div>
      <div id="cardContent" class="card-content collapsed">
        <div class="row">
          <label for="piName">PI Name (e.g. 26_04):</label>
          <input type="text" id="piName" placeholder="PI Name">
          <button id="loadBtn">Load Planning</button>
          <button id="openHistoryBtn" class="btn-secondary" style="margin-left: 5px;">Backups & History</button>
          <span id="statusMsg" style="margin-left: 10px;"></span>
          <label for="startDate" style="margin-left: 20px;">Start Date:</label>
          <input type="date" id="startDate">
          <label for="endDate">End Date:</label>
          <input type="date" id="endDate">
        </div>
        <div class="row" style="margin-top: 10px;">
          <div>
            <label for="memberInput">Add Member:</label>
            <input type="text" id="memberInput" placeholder="Name">
            <label for="teamSelect">to Team:</label>
            <select id="teamSelect"></select>
            <button id="addMemberBtn">Add</button>
          </div>
          <div>
            <label for="newTeamInput">Add Team:</label>
            <input type="text" id="newTeamInput" placeholder="New Team Name">
            <button id="addTeamBtn">Add</button>
          </div>
        </div>
      </div>
    </div>

    <div id="statusBar" style="display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-top: 10px;">
      <div style="display: flex; align-items: center; gap: 15px;">
        <div class="legend" id="statusLegend"></div>
        <button id="addTypeBtn" style="font-size: 11px; padding: 4px 8px;">+ Add Type</button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div id="filterSelector" style="display: flex; align-items: center; gap: 10px; font-size: 12px; background: #f3f4f6; padding: 6px 12px; border-radius: 6px; border: 1px solid #e5e7eb;">
          <label for="eventTypeFilter" style="font-weight: 600; color: #374151;">Filter Event:</label>
          <select id="eventTypeFilter" style="font-size: 12px; padding: 2px 6px; border-radius: 4px; border: 1px solid #ccc; background: white; cursor: pointer; height: 26px;">
            <option value="all">Show All</option>
          </select>
        </div>
        <div id="dayPartSelector" style="display: flex; align-items: center; gap: 10px; font-size: 12px; background: #f3f4f6; padding: 6px 12px; border-radius: 6px; border: 1px solid #e5e7eb;">
          <span style="font-weight: 600; color: #374151;">Day Part:</span>
          <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #4b5563;">
            <input type="radio" name="dayPart" value="full" checked style="cursor: pointer;"> Full Day
          </label>
          <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #4b5563;">
            <input type="radio" name="dayPart" value="morning" style="cursor: pointer;"> AM Only
          </label>
          <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; color: #4b5563;">
            <input type="radio" name="dayPart" value="afternoon" style="cursor: pointer;"> PM Only
          </label>
        </div>
      </div>
    </div>

    <!-- Type Editor Modal -->
    <div id="typeEditorModal" class="modal">
      <h3 id="typeEditorTitle">Add New Type</h3>
      <div class="modal-field">
        <label for="typeId">ID (unique):</label>
        <input type="text" id="typeId">
      </div>
      <div class="modal-field">
        <label for="typeLabel">Label:</label>
        <input type="text" id="typeLabel">
      </div>
      <div class="modal-field">
        <label for="typeColorPicker" id="typeColorLabel">Color (Hex):</label>
        <div class="color-picker-container">
          <input type="color" id="typeColorPicker" aria-labelledby="typeColorLabel">
          <input type="text" id="typeColor" placeholder="#ffffff" aria-label="Color Hex Code">
        </div>
      </div>
      <div class="modal-field">
        <label for="typeKind">Type:</label>
        <select id="typeKind">
          <option value="absence">Absence (Reduces Capacity)</option>
          <option value="information">Information (Label Only)</option>
        </select>
      </div>
      <div class="modal-field">
        <label for="typeDisplay">Display Position:</label>
        <select id="typeDisplay">
          <option value="middle">Middle (Main Cell Content)</option>
          <option value="left">Left (Sidebar)</option>
          <option value="right">Right (Sidebar)</option>
        </select>
      </div>
      <div id="reductionContainer" class="modal-field">
        <label for="typeReduction">Capacity Reduction (%):</label>
        <input type="number" id="typeReduction" value="100" min="0" max="100">
      </div>
      <div class="modal-actions">
        <button id="deleteTypeBtn" class="btn-danger">Delete</button>
        <div style="flex-grow: 1;"></div>
        <button id="cancelTypeBtn" class="btn-secondary">Cancel</button>
        <button id="saveTypeBtn" class="btn-primary">Save</button>
      </div>
    </div>
    <!-- Member Settings Modal -->
    <div id="memberSettingsModal" class="modal">
      <h3 id="memberSettingsTitle">Member Settings</h3>
      <div class="modal-field">
        <label for="memberHoursPerDay">Working Hours per Day:</label>
        <input type="number" id="memberHoursPerDay" value="8" min="0" max="24" step="0.5">
      </div>
      <div class="modal-field">
        <label for="memberPlanningAvailability">Planning Availability (%):</label>
        <input type="number" id="memberPlanningAvailability" value="100" min="0" max="100">
      </div>
      <div class="modal-field">
        <label>Working Days (Contract):</label>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <label style="display: flex; align-items: center; font-size: 12px; gap: 2px;">
            <input type="checkbox" id="workDay1" checked> Mo
          </label>
          <label style="display: flex; align-items: center; font-size: 12px; gap: 2px;">
            <input type="checkbox" id="workDay2" checked> Tu
          </label>
          <label style="display: flex; align-items: center; font-size: 12px; gap: 2px;">
            <input type="checkbox" id="workDay3" checked> We
          </label>
          <label style="display: flex; align-items: center; font-size: 12px; gap: 2px;">
            <input type="checkbox" id="workDay4" checked> Th
          </label>
          <label style="display: flex; align-items: center; font-size: 12px; gap: 2px;">
            <input type="checkbox" id="workDay5" checked> Fr
          </label>
          <label style="display: flex; align-items: center; font-size: 12px; gap: 2px;">
            <input type="checkbox" id="workDay6"> Sa
          </label>
          <label style="display: flex; align-items: center; font-size: 12px; gap: 2px;">
            <input type="checkbox" id="workDay0"> Su
          </label>
        </div>
      </div>
      <div style="margin-top: 20px; border-top: 1px solid #eedddd; padding-top: 12px;">
        <h4 style="color: #cc0000; margin: 0 0 8px 0; font-size: 14px;">Danger Zone</h4>
        <div class="modal-field" style="margin-bottom: 8px;">
          <label for="deleteMemberNameConfirm" style="font-size: 12px; color: #555;">Type member name to confirm deletion:</label>
          <input type="text" id="deleteMemberNameConfirm" placeholder="Type name to confirm">
        </div>
        <button id="deleteMemberBtn" class="btn-danger" style="width: 100%; padding: 8px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; background-color: #cc0000; color: white;">Delete Member</button>
      </div>
      <div class="modal-actions" style="margin-top: 16px;">
        <div style="flex-grow: 1;"></div>
        <button id="cancelMemberSettingsBtn" class="btn-secondary">Cancel</button>
        <button id="saveMemberSettingsBtn" class="btn-primary">Save</button>
      </div>
    </div>

    <div id="modalOverlay"></div>

    <!-- History & Backups Modal -->
    <div id="historyModal" class="modal" style="width: 580px; max-width: 95%; box-sizing: border-box;">
      <h3 style="margin-bottom: 8px;">Backups & Save History</h3>
      <div style="font-size: 13px; color: #555; margin-bottom: 12px; line-height: 1.4;">
        Autosaves within 2 minutes are grouped into single versions automatically. You can also create manual restore points here.
      </div>
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <input type="text" id="manualBackupLabel" placeholder="Checkpoint note (e.g. before deleting Bob)" aria-label="Checkpoint note" style="flex: 1; padding: 8px; margin: 0; font-size: 13px; box-sizing: border-box;">
        <button id="createManualBackupBtn" class="btn-primary" style="padding: 8px 16px; font-size: 13px; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; background: #0747a6; color: white;">Create Checkpoint</button>
      </div>
      <div style="border: 1px solid #ddd; border-radius: 4px; max-height: 250px; overflow-y: auto; background: #fafafa; margin-bottom: 16px;">
        <table id="backupTable" style="width: 100%; border-collapse: collapse; margin: 0; min-width: 100%;">
          <thead style="position: sticky; top: 0; background: #f0f4ff; z-index: 10;">
            <tr>
              <th style="padding: 10px 8px; text-align: left; font-size: 12px; border-bottom: 2px solid #ddd; width: 140px;">Date & Time</th>
              <th style="padding: 10px 8px; text-align: left; font-size: 12px; border-bottom: 2px solid #ddd;">Type / Note</th>
              <th style="padding: 10px 8px; text-align: right; font-size: 12px; border-bottom: 2px solid #ddd; width: 120px;">Action</th>
            </tr>
          </thead>
          <tbody id="backupTableBody" style="font-size: 12px;">
            <!-- list of backups loaded here -->
          </tbody>
        </table>
      </div>
      <div class="modal-actions" style="margin-top: 16px;">
        <button id="closeHistoryModalBtn" class="btn-secondary">Close</button>
      </div>
    </div>

    <div class="card" id="planningCard" style="display:none">
      <div id="planningTableContainer">
        <table id="planningTable">
          <thead>
            <tr id="tableHeader">
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </main>
  
  <input type="file" id="memberImageInput" style="display: none;" accept="image/*" aria-label="Upload member image">

  <script src="index.js"></script>
</body>
</html>
